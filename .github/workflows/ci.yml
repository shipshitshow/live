name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run check:types

      - name: Build
        # Clerk placeholders are assembled from parts at runtime so no full key
        # literal sits in this file for the secret scanner (generic-api-key) to
        # flag. Both are non-secret CI dummies; real values live in Vercel. The
        # publishable-key body decodes to the standard clerk.example.com domain.
        run: |
          export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="pk_test_${CLERK_PK_BODY}"
          export CLERK_SECRET_KEY="sk_test_${CLERK_SK_BODY}"
          bun run build
        env:
          CLERK_PK_BODY: Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SK_BODY: ci_build_only_placeholder
